<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Blog API Tester</title>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body { font-family: system-ui, sans-serif; background: #f1f5f9; color: #1e293b; }
  nav { background: #1e293b; color: white; padding: 14px 24px; display: flex; align-items: center; gap: 16px; }
  nav h1 { font-size: 18px; font-weight: 700; flex: 1; }
  nav button { background: #3b82f6; color: white; border: none; padding: 7px 14px; border-radius: 6px; cursor: pointer; font-size: 13px; }
  nav button:hover { background: #2563eb; }
  nav button.danger { background: #ef4444; }
  nav button.danger:hover { background: #dc2626; }
  #user-info { font-size: 13px; opacity: 0.8; }

  .container { max-width: 900px; margin: 30px auto; padding: 0 16px; }

  /* Tabs */
  .tabs { display: flex; gap: 4px; margin-bottom: 20px; border-bottom: 2px solid #e2e8f0; }
  .tab { padding: 10px 20px; cursor: pointer; border-radius: 6px 6px 0 0; font-size: 14px; font-weight: 500; color: #64748b; background: none; border: none; }
  .tab.active { background: white; color: #3b82f6; border-bottom: 2px solid #3b82f6; margin-bottom: -2px; }
  .tab-content { display: none; }
  .tab-content.active { display: block; }

  /* Cards */
  .card { background: white; border-radius: 10px; padding: 20px; margin-bottom: 16px; box-shadow: 0 1px 3px rgba(0,0,0,.08); }
  .card h2 { font-size: 16px; font-weight: 600; margin-bottom: 14px; color: #334155; }

  /* Forms */
  .form-row { display: flex; gap: 10px; flex-wrap: wrap; margin-bottom: 10px; }
  .form-row input, .form-row textarea, .form-row select { flex: 1; min-width: 160px; padding: 9px 12px; border: 1px solid #cbd5e1; border-radius: 6px; font-size: 14px; outline: none; }
  .form-row input:focus, .form-row textarea:focus { border-color: #3b82f6; }
  textarea { min-height: 80px; resize: vertical; }
  .btn { padding: 9px 18px; border: none; border-radius: 6px; cursor: pointer; font-size: 14px; font-weight: 500; }
  .btn-primary { background: #3b82f6; color: white; }
  .btn-primary:hover { background: #2563eb; }
  .btn-danger { background: #ef4444; color: white; }
  .btn-danger:hover { background: #dc2626; }
  .btn-secondary { background: #e2e8f0; color: #334155; }
  .btn-secondary:hover { background: #cbd5e1; }
  .btn-sm { padding: 5px 10px; font-size: 12px; }

  /* Posts list */
  .post-card { border: 1px solid #e2e8f0; border-radius: 8px; padding: 14px; margin-bottom: 10px; }
  .post-card h3 { font-size: 15px; font-weight: 600; margin-bottom: 4px; }
  .post-card .meta { font-size: 12px; color: #94a3b8; margin-bottom: 8px; }
  .post-card p { font-size: 14px; color: #475569; margin-bottom: 10px; line-height: 1.5; }
  .post-card img { max-width: 100%; max-height: 200px; border-radius: 6px; margin-bottom: 10px; display: block; }
  .post-actions { display: flex; gap: 8px; }

  /* Comments */
  .comment-item { border-left: 3px solid #e2e8f0; padding: 8px 12px; margin-bottom: 8px; }
  .comment-item .meta { font-size: 12px; color: #94a3b8; }
  .comment-item p { font-size: 14px; margin-top: 2px; }

  /* Alerts */
  .alert { padding: 10px 14px; border-radius: 6px; font-size: 14px; margin-bottom: 12px; }
  .alert-success { background: #dcfce7; color: #166534; }
  .alert-error { background: #fee2e2; color: #991b1b; }
  .alert-info { background: #dbeafe; color: #1e40af; }

  /* Search */
  #search-bar { display: flex; gap: 8px; margin-bottom: 16px; }
  #search-bar input { flex: 1; padding: 9px 12px; border: 1px solid #cbd5e1; border-radius: 6px; font-size: 14px; outline: none; }
  #search-bar input:focus { border-color: #3b82f6; }

  .loading { text-align: center; color: #94a3b8; padding: 20px; }
  .empty { text-align: center; color: #94a3b8; padding: 30px; font-size: 14px; }
  .badge { display: inline-block; padding: 2px 8px; border-radius: 99px; font-size: 11px; font-weight: 600; background: #e0f2fe; color: #0369a1; margin-left: 6px; }
</style>
</head>
<body>

<nav>
  <h1>📝 Blog API Tester</h1>
  <span id="user-info">Not logged in</span>
  <button class="danger" id="btn-logout" style="display:none" onclick="logout()">Logout</button>
</nav>

<div class="container">
  <div id="alert-box"></div>

  <!-- Auth Panel (shown when not logged in) -->
  <div id="auth-panel">
    <div class="tabs">
      <button class="tab active" onclick="switchAuthTab('login')">Login</button>
      <button class="tab" onclick="switchAuthTab('register')">Register</button>
    </div>

    <div id="tab-login" class="tab-content active">
      <div class="card">
        <h2>Login</h2>
        <div class="form-row">
          <input type="email" id="login-email" placeholder="Email" />
          <input type="password" id="login-password" placeholder="Password" />
        </div>
        <button class="btn btn-primary" onclick="login()">Login</button>
      </div>
    </div>

    <div id="tab-register" class="tab-content">
      <div class="card">
        <h2>Register</h2>
        <div class="form-row">
          <input type="text" id="reg-name" placeholder="Name" />
          <input type="email" id="reg-email" placeholder="Email" />
          <input type="password" id="reg-password" placeholder="Password" />
        </div>
        <button class="btn btn-primary" onclick="register()">Register</button>
      </div>
    </div>
  </div>

  <!-- Main Panel (shown when logged in) -->
  <div id="main-panel" style="display:none">
    <div class="tabs">
      <button class="tab active" onclick="switchTab('posts')">Posts</button>
      <button class="tab" onclick="switchTab('create')">Create Post</button>
    </div>

    <!-- Posts Tab -->
    <div id="tab-posts" class="tab-content active">
      <div id="search-bar">
        <input type="text" id="search-input" placeholder="Search posts by title or content..." oninput="searchPosts()" />
        <button class="btn btn-secondary" onclick="loadPosts()">Reset</button>
      </div>
      <div id="posts-list"><div class="loading">Loading posts...</div></div>
    </div>

    <!-- Create Post Tab -->
    <div id="tab-create" class="tab-content">
      <div class="card">
        <h2>Create New Post</h2>
        <div class="form-row">
          <input type="text" id="post-title" placeholder="Title" />
        </div>
        <div class="form-row">
          <textarea id="post-content" placeholder="Content"></textarea>
        </div>
        <div class="form-row">
          <input type="file" id="post-image" accept="image/*" />
        </div>
        <button class="btn btn-primary" onclick="createPost()">Publish Post</button>
      </div>
    </div>
  </div>

  <!-- Post Detail Modal -->
  <div id="modal-overlay" style="display:none;position:fixed;inset:0;background:rgba(0,0,0,.4);z-index:100;overflow-y:auto;" onclick="closeModal(event)">
    <div id="modal-box" style="background:white;max-width:680px;margin:40px auto;border-radius:12px;padding:28px;position:relative;">
      <button onclick="closeModalDirect()" style="position:absolute;top:14px;right:14px;background:none;border:none;font-size:20px;cursor:pointer;color:#64748b;">✕</button>
      <div id="modal-content"></div>
    </div>
  </div>
</div>

<script>
const API = '/api';
let token = localStorage.getItem('token') || null;
let currentUser = JSON.parse(localStorage.getItem('user') || 'null');
let searchTimeout = null;

// ── Init ──────────────────────────────────────────────────────────────
window.onload = () => {
  if (token && currentUser) showMainPanel();
};

function showMainPanel() {
  document.getElementById('auth-panel').style.display = 'none';
  document.getElementById('main-panel').style.display = 'block';
  document.getElementById('user-info').textContent = `👤 ${currentUser.name}`;
  document.getElementById('btn-logout').style.display = 'inline-block';
  loadPosts();
}

// ── Alerts ────────────────────────────────────────────────────────────
function showAlert(msg, type = 'info') {
  const box = document.getElementById('alert-box');
  box.innerHTML = `<div class="alert alert-${type}">${msg}</div>`;
  setTimeout(() => box.innerHTML = '', 3500);
}

// ── Tabs ──────────────────────────────────────────────────────────────
function switchAuthTab(name) {
  document.querySelectorAll('#auth-panel .tab, #auth-panel .tab-content').forEach(el => el.classList.remove('active'));
  document.querySelector(`#auth-panel .tab[onclick*="${name}"]`).classList.add('active');
  document.getElementById(`tab-${name}`).classList.add('active');
}

function switchTab(name) {
  document.querySelectorAll('#main-panel .tab, #main-panel .tab-content').forEach(el => el.classList.remove('active'));
  document.querySelector(`#main-panel .tab[onclick*="${name}"]`).classList.add('active');
  document.getElementById(`tab-${name}`).classList.add('active');
  if (name === 'posts') loadPosts();
}

// ── API Helper ────────────────────────────────────────────────────────
async function api(method, path, body = null, isForm = false) {
  const headers = {};
  if (token) headers['Authorization'] = `Bearer ${token}`;
  if (!isForm) headers['Accept'] = 'application/json';
  if (!isForm && body) headers['Content-Type'] = 'application/json';

  const res = await fetch(API + path, {
    method,
    headers,
    body: isForm ? body : (body ? JSON.stringify(body) : null)
  });
  const data = await res.json().catch(() => ({}));
  return { ok: res.ok, status: res.status, data };
}

// ── Auth ──────────────────────────────────────────────────────────────
async function login() {
  const email = document.getElementById('login-email').value.trim();
  const password = document.getElementById('login-password').value;
  if (!email || !password) return showAlert('Fill in email and password.', 'error');

  const { ok, data } = await api('POST', '/login', { email, password });
  if (ok) {
    token = data.token;
    currentUser = data.user;
    localStorage.setItem('token', token);
    localStorage.setItem('user', JSON.stringify(currentUser));
    showAlert('Logged in!', 'success');
    showMainPanel();
  } else {
    showAlert(data.message || 'Login failed.', 'error');
  }
}

async function register() {
  const name = document.getElementById('reg-name').value.trim();
  const email = document.getElementById('reg-email').value.trim();
  const password = document.getElementById('reg-password').value;
  if (!name || !email || !password) return showAlert('Fill all fields.', 'error');

  const { ok, data } = await api('POST', '/register', { name, email, password });
  if (ok) {
    token = data.token;
    currentUser = data.user;
    localStorage.setItem('token', token);
    localStorage.setItem('user', JSON.stringify(currentUser));
    showAlert('Registered & logged in!', 'success');
    showMainPanel();
  } else {
    const errors = data.errors ? Object.values(data.errors).flat().join(' ') : data.message;
    showAlert(errors || 'Registration failed.', 'error');
  }
}

async function logout() {
  await api('POST', '/logout');
  token = null; currentUser = null;
  localStorage.removeItem('token');
  localStorage.removeItem('user');
  document.getElementById('auth-panel').style.display = 'block';
  document.getElementById('main-panel').style.display = 'none';
  document.getElementById('user-info').textContent = 'Not logged in';
  document.getElementById('btn-logout').style.display = 'none';
  showAlert('Logged out.', 'info');
}

// ── Posts ─────────────────────────────────────────────────────────────
async function loadPosts(search = '') {
  document.getElementById('posts-list').innerHTML = '<div class="loading">Loading...</div>';
  const path = search ? `/posts?search=${encodeURIComponent(search)}` : '/posts';
  const { ok, data } = await api('GET', path);
  if (!ok) return document.getElementById('posts-list').innerHTML = '<div class="empty">Failed to load posts.</div>';

  const posts = data.data || data;
  if (!posts.length) {
    document.getElementById('posts-list').innerHTML = '<div class="empty">No posts found.</div>';
    return;
  }
  document.getElementById('posts-list').innerHTML = posts.map(p => renderPost(p)).join('');
}

function renderPost(p) {
  const isOwner = currentUser && p.user_id == currentUser.id;
  const img = p.image ? `<img src="${p.image}" alt="post image" />` : '';
  const actions = isOwner
    ? `<button class="btn btn-danger btn-sm" onclick="deletePost(${p.id})">Delete</button>
       <button class="btn btn-secondary btn-sm" onclick="openEditModal(${p.id})">Edit</button>`
    : '';
  return `
    <div class="post-card" id="post-${p.id}">
      ${img}
      <h3>${escHtml(p.title)}</h3>
      <div class="meta">By ${escHtml(p.user?.name || 'Unknown')} · ${formatDate(p.created_at)}</div>
      <p>${escHtml(p.content.substring(0, 180))}${p.content.length > 180 ? '…' : ''}</p>
      <div class="post-actions">
        <button class="btn btn-secondary btn-sm" onclick="openPostModal(${p.id})">View & Comments</button>
        ${actions}
      </div>
    </div>`;
}

function searchPosts() {
  clearTimeout(searchTimeout);
  searchTimeout = setTimeout(() => {
    const q = document.getElementById('search-input').value.trim();
    loadPosts(q);
  }, 400);
}

async function createPost() {
  const title = document.getElementById('post-title').value.trim();
  const content = document.getElementById('post-content').value.trim();
  const imageFile = document.getElementById('post-image').files[0];
  if (!title || !content) return showAlert('Title and content are required.', 'error');

  const form = new FormData();
  form.append('title', title);
  form.append('content', content);
  if (imageFile) form.append('image', imageFile);

  const { ok, data } = await api('POST', '/posts', form, true);
  if (ok) {
    showAlert('Post created!', 'success');
    document.getElementById('post-title').value = '';
    document.getElementById('post-content').value = '';
    document.getElementById('post-image').value = '';
    switchTab('posts');
  } else {
    const errors = data.errors ? Object.values(data.errors).flat().join(' ') : data.message;
    showAlert(errors || 'Failed to create post.', 'error');
  }
}

async function deletePost(id) {
  if (!confirm('Delete this post?')) return;
  const { ok } = await api('DELETE', `/posts/${id}`);
  if (ok) { showAlert('Post deleted.', 'success'); loadPosts(); }
  else showAlert('Failed to delete post.', 'error');
}

// ── Post Modal (view + edit + comments) ───────────────────────────────
async function openPostModal(id) {
  document.getElementById('modal-content').innerHTML = '<div class="loading">Loading...</div>';
  document.getElementById('modal-overlay').style.display = 'block';

  const { ok, data } = await api('GET', `/posts/${id}`);
  if (!ok) { document.getElementById('modal-content').innerHTML = '<div class="empty">Failed to load.</div>'; return; }

  const p = data.data || data;
  const isOwner = currentUser && p.user_id == currentUser.id;
  const img = p.image ? `<img src="${p.image}" style="max-width:100%;border-radius:8px;margin-bottom:12px;" />` : '';

  document.getElementById('modal-content').innerHTML = `
    <h2 style="font-size:20px;margin-bottom:6px;">${escHtml(p.title)}</h2>
    <div style="font-size:12px;color:#94a3b8;margin-bottom:14px;">By ${escHtml(p.user?.name || 'Unknown')} · ${formatDate(p.created_at)}</div>
    ${img}
    <p style="font-size:15px;line-height:1.7;margin-bottom:20px;">${escHtml(p.content)}</p>

    ${isOwner ? `
    <div style="border-top:1px solid #e2e8f0;padding-top:16px;margin-bottom:20px;">
      <h3 style="font-size:14px;font-weight:600;margin-bottom:10px;">Edit Post</h3>
      <div class="form-row"><input type="text" id="edit-title" value="${escAttr(p.title)}" placeholder="Title" /></div>
      <div class="form-row"><textarea id="edit-content" placeholder="Content">${escHtml(p.content)}</textarea></div>
      <div class="form-row"><input type="file" id="edit-image" accept="image/*" /></div>
      <button class="btn btn-primary btn-sm" onclick="updatePost(${p.id})">Save Changes</button>
    </div>` : ''}

    <div style="border-top:1px solid #e2e8f0;padding-top:16px;">
      <h3 style="font-size:14px;font-weight:600;margin-bottom:12px;">Comments</h3>
      <div id="comments-list-${p.id}"><div class="loading">Loading comments...</div></div>
      <div class="form-row" style="margin-top:12px;">
        <textarea id="comment-input-${p.id}" placeholder="Write a comment..." style="min-height:60px;"></textarea>
      </div>
      <button class="btn btn-primary btn-sm" onclick="addComment(${p.id})">Post Comment</button>
    </div>`;

  loadComments(p.id);
}

async function openEditModal(id) {
  openPostModal(id);
}

async function updatePost(id) {
  const title = document.getElementById('edit-title').value.trim();
  const content = document.getElementById('edit-content').value.trim();
  const imageFile = document.getElementById('edit-image').files[0];
  if (!title || !content) return showAlert('Title and content required.', 'error');

  const form = new FormData();
  form.append('title', title);
  form.append('content', content);
  form.append('_method', 'PUT');
  if (imageFile) form.append('image', imageFile);

  const { ok, data } = await api('POST', `/posts/${id}`, form, true);
  if (ok) {
    showAlert('Post updated!', 'success');
    closeModalDirect();
    loadPosts();
  } else {
    const errors = data.errors ? Object.values(data.errors).flat().join(' ') : data.message;
    showAlert(errors || 'Update failed.', 'error');
  }
}

// ── Comments ──────────────────────────────────────────────────────────
async function loadComments(postId) {
  const { ok, data } = await api('GET', `/posts/${postId}/comments`);
  const list = document.getElementById(`comments-list-${postId}`);
  if (!list) return;
  if (!ok) { list.innerHTML = '<div class="empty">Failed to load comments.</div>'; return; }

  const comments = data.data || data;
  if (!comments.length) { list.innerHTML = '<div class="empty">No comments yet.</div>'; return; }

  list.innerHTML = comments.map(c => {
    const canDelete = currentUser && c.user_id == currentUser.id;
    return `<div class="comment-item" id="comment-${c.id}">
      <div class="meta">${escHtml(c.user?.name || 'Unknown')} · ${formatDate(c.created_at)}</div>
      <p>${escHtml(c.comment)}</p>
      ${canDelete ? `<button class="btn btn-danger btn-sm" style="margin-top:6px;" onclick="deleteComment(${c.id}, ${postId})">Delete</button>` : ''}
    </div>`;
  }).join('');
}

async function addComment(postId) {
  const input = document.getElementById(`comment-input-${postId}`);
  const comment = input.value.trim();
  if (!comment) return showAlert('Comment cannot be empty.', 'error');

  const { ok, data } = await api('POST', `/posts/${postId}/comments`, { comment });
  if (ok) { input.value = ''; loadComments(postId); }
  else showAlert(data.message || 'Failed to post comment.', 'error');
}

async function deleteComment(id, postId) {
  if (!confirm('Delete this comment?')) return;
  const { ok } = await api('DELETE', `/comments/${id}`);
  if (ok) loadComments(postId);
  else showAlert('Failed to delete comment.', 'error');
}

// ── Modal ─────────────────────────────────────────────────────────────
function closeModal(e) { if (e.target === document.getElementById('modal-overlay')) closeModalDirect(); }
function closeModalDirect() { document.getElementById('modal-overlay').style.display = 'none'; }

// ── Helpers ───────────────────────────────────────────────────────────
function escHtml(str) {
  return String(str || '').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');
}
function escAttr(str) { return escHtml(str); }
function formatDate(str) {
  if (!str) return '';
  return new Date(str).toLocaleDateString('en-US', { year:'numeric', month:'short', day:'numeric' });
}
</script>
</body>
</html>
